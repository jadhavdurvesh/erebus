# Illustrative policy format only. The configuration loader is not implemented.
# Rule order is significant; first matching rule wins.
# CIDR address selectors support both IPv4 and IPv6 in the current policy core.

[policy]
default = "deny"

[[rules]]
id = "allow-outbound-https-to-example-subnet"
direction = "outbound"
protocol = "tcp"
destination = "198.51.100.0/24"
destination_port = 443
action = "allow"

[[rules]]
id = "allow-outbound-dns-udp"
direction = "outbound"
protocol = "udp"
destination_port = 53
action = "allow"

[[rules]]
id = "deny-inbound-ssh-from-untrusted"
direction = "inbound"
protocol = "tcp"
source = "0.0.0.0/0"
destination_port = 22
interface = "eth0"
action = "deny"
