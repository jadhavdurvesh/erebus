# EREBUS policy schema version 1.
# This file is validated/exported by the offline CLI; it is NOT applied to the host.
# Rule order matters: the first matching rule wins.

schema_version = 1

[policy]
default = "deny"

[[rules]]
id = "allow-outbound-https-to-example-subnet"
direction = "outbound"
protocol = "tcp"
destination = "198.51.100.0/24"
destination_port = 443
action = "allow"

[[rules]]
id = "allow-outbound-dns-udp"
direction = "outbound"
protocol = "udp"
destination_port = 53
action = "allow"

[[rules]]
id = "deny-inbound-ssh-from-untrusted"
direction = "inbound"
protocol = "tcp"
source = "0.0.0.0/0"
destination_port = 22
interface = "eth0"
action = "deny"
